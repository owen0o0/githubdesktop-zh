<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>词典编辑 · GitHub Desktop 汉化</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <main class="shell shell-wide">
      <nav class="site-nav">
        <a href="./">汉化</a>
        <a href="./dict.html">词典</a>
        <a href="./dict-edit.html" aria-current="page">编辑</a>
        <a href="./help.html">帮助</a>
      </nav>

      <header class="brand brand-compact">
        <p class="eyebrow">Editor</p>
        <h1>编辑词典</h1>
        <p class="lede">需密码解锁后方可修改。先选平台，保存写入对应 `web/dict/*.zh`，并备份为 `*.zh.bak`。</p>
      </header>

      <section class="stage" id="gate">
        <form class="auth-form" id="auth-form">
          <label class="field grow">
            <span>编辑密码</span>
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="btn btn-primary" type="submit">解锁编辑</button>
        </form>
        <p class="status" id="auth-status"></p>
      </section>

      <section class="stage" id="editor" hidden>
        <div class="dict-toolbar">
          <label class="field input-field">
            <select id="platform" aria-label="选择平台词典"></select>
            <span>平台</span>
          </label>
          <label class="field input-field grow">
            <input id="q" type="search" placeholder="英文 / 中文…" autocomplete="off" />
            <span>搜索</span>
          </label>
          <label class="field input-field">
            <select id="target">
              <option value="">全部</option>
              <option value="main.js">main.js</option>
              <option value="renderer.js">renderer.js</option>
            </select>
            <span>目标</span>
          </label>
          <div class="btn-group">
            <button class="btn btn-ghost" type="button" id="add">新增一行</button>
            <button class="btn btn-primary" type="button" id="save">保存</button>
            <button class="btn btn-ghost" type="button" id="lock">锁定</button>
          </div>
        </div>
        <p class="dict-count" id="count"></p>

        <div class="dict-table-wrap">
          <table class="dict-table dict-table-edit">
            <thead>
              <tr>
                <th class="col-i">#</th>
                <th>英文</th>
                <th>中文</th>
                <th class="col-meta">分类</th>
                <th class="col-meta">目标</th>
                <th class="col-act"></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="status" id="status"></p>
      </section>
    </main>
    <script type="module" src="./dict-edit.js"></script>
  </body>
</html>
